<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Reimposta password - Genetics</title>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;

            display: flex;
            align-items: center;
            justify-content: center;

            background: #0B1020;
            color: white;

            font-family: Arial, sans-serif;
        }

        .container {
            width: 100%;
            max-width: 420px;
            padding: 32px 24px;
            text-align: center;
        }

        .logo {
            font-size: 38px;
            font-weight: bold;
            letter-spacing: 6px;
            margin-bottom: 10px;
        }

        .subtitle {
            color: #94A3B8;
            font-size: 14px;
            margin-bottom: 30px;
        }

        .card {
            background: #111827;
            border-radius: 18px;
            padding: 28px 24px;
        }

        h1 {
            font-size: 24px;
            margin: 0 0 10px 0;
        }

        .description {
            color: #94A3B8;
            font-size: 14px;
            line-height: 1.5;
            margin-bottom: 24px;
        }

        input {
            width: 100%;
            height: 50px;

            padding: 0 14px;
            margin-bottom: 14px;

            border: none;
            border-radius: 10px;

            background: #1E293B;
            color: white;

            font-size: 15px;
            outline: none;
        }

        input::placeholder {
            color: #64748B;
        }

        button {
            width: 100%;
            height: 50px;

            margin-top: 8px;

            border: none;
            border-radius: 10px;

            background: #3B82F6;
            color: white;

            font-size: 15px;
            font-weight: bold;

            cursor: pointer;
        }

        button:disabled {
            opacity: 0.6;
            cursor: default;
        }

        .message {
            display: none;

            margin-top: 18px;
            padding: 12px;

            border-radius: 8px;

            font-size: 13px;
            line-height: 1.4;
        }

        .error {
            background: #451A1A;
            color: #FCA5A5;
        }

        .success {
            background: #14351F;
            color: #86EFAC;
        }

        .hidden {
            display: none;
        }

        .back {
            display: inline-block;
            margin-top: 20px;

            color: #3B82F6;
            font-size: 13px;
            text-decoration: none;
        }
    </style>
</head>

<body>

<div class="container">

    <div class="logo">GENETICS</div>

    <div class="subtitle">
        Scopri la potenza dell'evoluzione
    </div>

    <div class="card">

        <!-- FORM -->
        <div id="resetForm">

            <h1>Reimposta password</h1>

            <div class="description">
                Inserisci la tua nuova password.
            </div>

            <input
                id="password"
                type="password"
                placeholder="Nuova password"
                autocomplete="new-password"
            >

            <input
                id="confirmPassword"
                type="password"
                placeholder="Conferma nuova password"
                autocomplete="new-password"
            >

            <button id="resetButton">
                CAMBIA PASSWORD
            </button>

        </div>

        <!-- SUCCESS -->
        <div id="successMessage" class="message success">
            Password aggiornata con successo!<br>
            Ora puoi tornare nell'app Genetics ed effettuare l'accesso.
        </div>

        <!-- ERROR -->
        <div id="errorMessage" class="message error"></div>

        <a
            class="back"
            href="https://bac92.github.io/Genetics/"
        >
            Torna a Genetics
        </a>

    </div>

</div>

<script>

    const SUPABASE_URL = "https://api.genetics.me.uk";

    // METTI QUI LA TUA ANON KEY / PUBLISHABLE KEY
    const SUPABASE_ANON_KEY = "LA_TUA_ANON_KEY";

    const supabaseClient = window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_ANON_KEY
    );

    const resetForm = document.getElementById("resetForm");
    const resetButton = document.getElementById("resetButton");

    const successMessage = document.getElementById("successMessage");
    const errorMessage = document.getElementById("errorMessage");

    function showError(message) {
        errorMessage.textContent = message;
        errorMessage.style.display = "block";
    }

    function showSuccess() {
        resetForm.classList.add("hidden");
        successMessage.style.display = "block";
        errorMessage.style.display = "none";
    }

    async function updatePassword() {

        const password =
            document.getElementById("password").value;

        const confirmPassword =
            document.getElementById("confirmPassword").value;

        errorMessage.style.display = "none";

        if (!password || !confirmPassword) {
            showError("Compila entrambi i campi.");
            return;
        }

        if (password.length < 6) {
            showError(
                "La password deve contenere almeno 6 caratteri."
            );
            return;
        }

        if (password !== confirmPassword) {
            showError("Le password non coincidono.");
            return;
        }

        resetButton.disabled = true;
        resetButton.textContent = "AGGIORNAMENTO...";

        try {

            const { error } =
                await supabaseClient.auth.updateUser({
                    password: password
                });

            if (error) {
                throw error;
            }

            showSuccess();

        } catch (error) {

            console.error(error);

            showError(
                error.message ||
                "Impossibile aggiornare la password."
            );

            resetButton.disabled = false;
            resetButton.textContent = "CAMBIA PASSWORD";
        }
    }

    resetButton.addEventListener(
        "click",
        updatePassword
    );


    /*
     * Supabase genera l'evento PASSWORD_RECOVERY
     * quando l'utente arriva qui tramite il link
     * ricevuto nella mail.
     */

    supabaseClient.auth.onAuthStateChange(
        async (event, session) => {

            console.log("Auth event:", event);

            if (event === "PASSWORD_RECOVERY") {

                console.log(
                    "Sessione recovery valida."
                );

                resetForm.classList.remove("hidden");
            }
        }
    );

</script>

</body>
</html>
